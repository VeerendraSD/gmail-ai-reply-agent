<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gmail AI Reply</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header><div class="logo">✦</div><div><h1>Gmail AI Reply</h1><p>Local AI · No API key</p></div></header>
  <label for="instruction">What do you want to reply?</label>
  <textarea id="instruction" rows="5" placeholder="e.g. Thank them, confirm Friday works, and keep it professional."></textarea>
  <label for="tone">Tone</label>
  <select id="tone">
    <option>Professional and polite</option>
    <option>Friendly and casual</option>
    <option>Concise and direct</option>
    <option>Warm and appreciative</option>
    <option>Firm but respectful</option>
  </select>
  <button id="generate" class="primary">Generate reply</button>
  <div id="status" role="status" aria-live="polite"></div>
  <label for="reply">Review and edit the reply</label>
  <textarea id="reply" rows="10" placeholder="Your generated draft appears here."></textarea>
  <div class="buttons">
    <button id="insert" class="primary" disabled>Insert into Gmail</button>
    <button id="copy" class="secondary" disabled>Copy</button>
  </div>
  <p class="note">The model runs locally on your computer. Nothing is sent automatically. Review before sending.</p>
  <script src="sidepanel.js"></script>
</body>
</html>
